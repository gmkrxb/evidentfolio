name: Feature request
description: Propose a focused product or engineering improvement
title: "[Feature]: "
labels: [enhancement, needs-discussion]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What portfolio author or visitor problem should be solved?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed experience
      description: Describe the user flow, not only the implementation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives and trade-offs
  - type: checkboxes
    attributes:
      label: Scope checks
      options:
        - label: I considered mobile, accessibility, localization, data migration, and self-hosting impact.
          required: true
